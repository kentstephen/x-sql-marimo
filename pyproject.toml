[project]
name = "x-sql-marimo"
version = "0.1.0"
description = "Global deforestation 2002-2022 folded to H3 and joined onto Overture divisions"
readme = "README.md"
requires-python = ">=3.13"

# The union of the two maintained notebooks' PEP 723 headers, and nothing else. The
# archived notebooks need a wider set; that lives in archive/pyproject.toml so this one
# can stay honest about what is actually imported.
#
#   xsql-deforest-divisions.py   adds async-geotiff (the COG reader), duckdb,
#                                geoarrow-rust-core
#   xsql-mapterhorn-explorer.py           adds pillow        (the terrarium WebP decode)
#   xsql-hrrr-counties.py        adds icechunk (the analysis store), zarr
#   xsql-hrrr-heat-hex.py        a subset of the counties film's header, nothing new
dependencies = [
    "anywidget>=0.9",
    "arro3-core",
    "async-geotiff>=0.4",
    "datafusion>=54.0.0",
    "duckdb>=1.5.5",
    "geoarrow-rust-core>=0.6",
    "h3ronpy>=0.22.0",
    "icechunk",
    "lonboard[geotiff]>=0.16.0",
    "marimo>=0.23.16",
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "obstore>=0.9.2",
    "pillow>=11",
    "pyarrow>=25.0.0",
    "xarray",
    "xarray-sql>=0.3.2",
    "zarr>=3",
]
